<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle de Cirurgias Eletivas</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial,Segoe UI,sans-serif;background:#f3f5f8;color:#20242c}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(440px,100%);background:#fff;border:1px solid #d9dee7;border-radius:14px;padding:28px;box-shadow:0 12px 36px #1d293915}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0}.field label{font-size:12px;font-weight:700}.field input{padding:10px;border:1px solid #cbd2dc;border-radius:6px}.btn{border:0;border-radius:6px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#0959b8;color:#fff}.secondary{background:#fff;border:1px solid #c7ced8}.muted{color:#657084;font-size:12px}</style></head><body><div class="login"><div class="box"><h1 style="margin-top:0">Controle de Cirurgias Eletivas</h1><p class="muted">Acesso restrito à equipe autorizada</p><div class="field"><label>Nome completo</label><input id="fullName" placeholder="Necessário apenas para criar acesso"></div><div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field"><label>Senha</label><input id="pass" type="password"></div><div style="display:flex;gap:8px"><button class="btn primary" id="enterBtn">Entrar</button><button class="btn secondary" id="signupBtn">Criar acesso</button></div><div id="msg" class="muted" style="margin-top:10px">O primeiro usuário será administrador; os demais precisam de aprovação.</div></div></div><script>const sb=supabase.createClient('https://uulsxmdycbihwkbftcdv.supabase.co','sb_publishable_odmXzemIQZwx1BxrJiUYnQ_iZfPVHlV');const msg=document.getElementById('msg');async function go(){location.href='/index.html'}document.getElementById('enterBtn').onclick=async()=>{const email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value;if(!email||!password){msg.textContent='Preencha e-mail e senha.';return}msg.textContent='Entrando...';const {error}=await sb.auth.signInWithPassword({email,password});if(error){msg.textContent=error.message;return}msg.textContent='Login realizado.';go()};document.getElementById('signupBtn').onclick=async()=>{const full_name=document.getElementById('fullName').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value;if(!full_name||!email||!password){msg.textContent='Preencha nome, e-mail e senha.';return}msg.textContent='Criando acesso...';const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name}}});if(error){msg.textContent=error.message;return}if(data.session){msg.textContent='Cadastro criado. Entrando...';go()}else{msg.textContent='Cadastro criado. Se for solicitado, confirme seu e-mail e depois clique em Entrar.'}};(async()=>{const {data:{session}}=await sb.auth.getSession();if(session)go()})()</script></body></html>
