<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle de Cirurgias Eletivas</title><style>
body{margin:0;font-family:Arial,Segoe UI,sans-serif;background:#f3f5f8;color:#20242c}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(440px,100%);background:#fff;border:1px solid #d9dee7;border-radius:14px;padding:28px;box-shadow:0 12px 36px #1d293915}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0}.field label{font-size:12px;font-weight:700}.field input{padding:10px;border:1px solid #cbd2dc;border-radius:6px}.btn{border:0;border-radius:6px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#0959b8;color:#fff}.secondary{background:#fff;border:1px solid #c7ced8}.muted{color:#657084;font-size:12px}.err{color:#b42318}.ok{color:#16784a}
</style></head><body><div class="login"><div class="box"><h1 style="margin-top:0">Controle de Cirurgias Eletivas</h1><p class="muted">Acesso restrito à equipe autorizada</p>
<div class="field"><label>Nome completo</label><input id="fullName" placeholder="Necessário apenas para criar acesso"></div>
<div class="field"><label>E-mail</label><input id="email" type="email"></div>
<div class="field"><label>Senha</label><input id="pass" type="password"></div>
<div style="display:flex;gap:8px"><button class="btn primary" id="enterBtn">Entrar</button><button class="btn secondary" id="signupBtn">Criar acesso</button></div>
<div id="msg" class="muted" style="margin-top:10px">O primeiro usuário será administrador; os demais precisam de aprovação.</div></div></div>
<script>
const URL='https://uulsxmdycbihwkbftcdv.supabase.co';
const KEY='sb_publishable_odmXzemIQZwx1BxrJiUYnQ_iZfPVHlV';
const msg=document.getElementById('msg');
function setmsg(t,cls=''){msg.className='muted '+cls;msg.textContent=t}
function saveSession(j){if(j.access_token){localStorage.setItem('sb_access_token',j.access_token);localStorage.setItem('sb_refresh_token',j.refresh_token||'');localStorage.setItem('sb_user',JSON.stringify(j.user||{}));return true}return false}
async function req(path,opts={}){const r=await fetch(URL+path,{...opts,headers:{'apikey':KEY,'Content-Type':'application/json',...(opts.headers||{})}});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j.msg||j.message||j.error_description||j.error||('Erro HTTP '+r.status));return j}
document.getElementById('enterBtn').addEventListener('click',async()=>{const e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value;if(!e||!p)return setmsg('Preencha e-mail e senha.','err');setmsg('Entrando...');try{const j=await req('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:e,password:p})});saveSession(j);setmsg('Login realizado.','ok');location.href='/app.html'}catch(err){setmsg(err.message,'err')}});
document.getElementById('signupBtn').addEventListener('click',async()=>{const n=document.getElementById('fullName').value.trim(),e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value;if(!n||!e||!p)return setmsg('Preencha nome, e-mail e senha.','err');setmsg('Criando acesso...');try{const j=await req('/auth/v1/signup',{method:'POST',body:JSON.stringify({email:e,password:p,data:{full_name:n}})});if(saveSession(j)){setmsg('Cadastro criado. Entrando...','ok');setTimeout(()=>location.href='/app.html',400)}else setmsg('Cadastro criado. Se o Supabase exigir confirmação, confirme o e-mail e depois clique em Entrar.','ok')}catch(err){setmsg(err.message,'err')}});
if(localStorage.getItem('sb_access_token')) location.href='/app.html';
</script></body></html>
