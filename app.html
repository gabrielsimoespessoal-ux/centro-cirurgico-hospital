<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hospital São José — Gestão Cirúrgica</title><style>
:root{--bg:#f5f8fc;--panel:#fff;--line:#d7e0ea;--text:#152238;--muted:#64748b;--blue:#1f3f8f;--blue2:#2d66c3;--light:#edf3fb;--green:#0f8a4b;--red:#c62828;--orange:#e07a00;--teal:#35aaa8;--shadow:0 2px 8px #16355d12}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hide{display:none!important}.topbar{background:#fff;border-bottom:1px solid #e5ebf2;padding:14px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px;position:sticky;top:0;z-index:20}.brand{display:flex;gap:12px;align-items:center}.brand-icon{width:42px;height:42px;border:1px solid #b9c9de;border-radius:9px;display:grid;place-items:center;font-size:23px;background:#fff}.brand h1{margin:0;color:var(--blue);font-size:22px}.brand small{color:var(--muted)}.top-actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid #c8d5e5;background:#fff;border-radius:8px;padding:9px 13px;font-weight:700;color:#20334e}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.green{background:var(--green);color:#fff;border-color:var(--green)}.btn.red{background:var(--red);color:#fff;border-color:var(--red)}.btn.orange{background:#fff5e9;color:#a95a00;border-color:#f1c18e}.btn.small{padding:5px 8px;font-size:12px}.wrap{max-width:1400px;margin:auto;padding:20px}.filterbar,.tabs,.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.filterbar{padding:14px;margin-bottom:14px}.filter-title{font-weight:800;color:var(--blue);margin-bottom:10px}.filters{display:grid;grid-template-columns:2fr 1.4fr 1.4fr 1fr 1fr 1fr;gap:8px}.filters input,.filters select{padding:9px;border:1px solid #c9d6e6;border-radius:7px;min-width:0}.tabs{display:flex;gap:5px;overflow-x:auto;padding:10px;margin-bottom:14px}.tab{white-space:nowrap;border:0;border-bottom:2px solid transparent;background:#eaf0f7;padding:11px 14px;border-radius:7px 7px 0 0;font-weight:800;color:#54667d}.tab.on{background:#fff;color:var(--blue);border-bottom-color:var(--blue)}.card{padding:18px;margin-bottom:16px}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.section-head h2{margin:0;color:var(--blue);font-size:20px}.sub{color:var(--muted);font-size:12px;margin-top:4px}.notice{background:#eef5ff;border-left:4px solid var(--blue2);padding:10px 12px;margin:12px 0;font-size:12px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:9px}.table{border-collapse:collapse;width:100%;min-width:1250px}.table th{background:#6f9fe6;color:#fff;font-size:11px;padding:10px;position:sticky;top:0;text-align:left}.table th.actions{background:#33465f}.table td{padding:10px;border-bottom:1px solid #e7edf4;font-size:12px;vertical-align:top}.table tbody tr:nth-child(even){background:#f9fbfd}.acts{display:flex;gap:4px;flex-wrap:wrap;min-width:275px}.pill{display:inline-block;border-radius:999px;padding:3px 8px;font-size:10px;font-weight:800;background:#edf2f7}.pill.ok{background:#e8f7ee;color:#08713d}.pill.warn{background:#fff5dd;color:#986100}.pill.bad{background:#ffe9e7;color:#a42318}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;font-weight:800;color:#263b59}.field input,.field select,.field textarea{border:1px solid #c9d6e6;border-radius:7px;padding:9px;background:#fff}.span2{grid-column:span 2}.span3{grid-column:span 3}.checkgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.check{display:flex;gap:8px;align-items:flex-start;background:#f7f9fc;border:1px solid #e0e7f0;padding:9px;border-radius:8px;font-size:12px}.back{position:fixed;inset:0;background:#16203399;z-index:50;display:grid;place-items:center;padding:16px}.modal{width:min(980px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:13px;box-shadow:0 20px 60px #0003}.mh,.mf{position:sticky;background:#fff;z-index:3;padding:14px 18px;display:flex;justify-content:space-between;gap:10px}.mh{top:0;border-bottom:1px solid var(--line)}.mf{bottom:0;border-top:1px solid var(--line);justify-content:flex-end}.mb{padding:18px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}.kpi{background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:10px;padding:15px}.kpi.orange{border-left-color:var(--orange)}.kpi.green{border-left-color:var(--green)}.kpi.teal{border-left-color:var(--teal)}.kpi .label{font-size:11px;color:var(--muted);font-weight:800}.kpi .value{font-size:28px;color:var(--blue);font-weight:900;margin-top:6px}.chart{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}.barrow{display:grid;grid-template-columns:180px 1fr 70px;gap:8px;align-items:center;margin:7px 0;font-size:12px}.bar{height:18px;background:#edf2f7;border-radius:999px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2c5bad,#6fa0e7);border-radius:999px}.map-modes{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.room{border:1px solid var(--line);border-radius:10px;background:#fff}.room h3{margin:0;padding:13px;border-bottom:1px solid var(--line);color:var(--blue)}.room .body{padding:14px;color:var(--muted);min-height:62px}.mini-tabs{display:flex;gap:5px;overflow:auto;margin:12px 0;border-bottom:1px solid #b9cbe1}.mini-tab{padding:10px 14px;background:#e8eef6;border:0;font-weight:800;color:#61738a}.mini-tab.on{background:#fff;color:var(--blue);border-bottom:2px solid var(--blue)}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.loginbox{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 14px 40px #10294a1c}.loginbox h1{color:var(--blue)}@media(max-width:1000px){.filters{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.span2,.span3{grid-column:span 1}.cards,.rooms{grid-template-columns:1fr 1fr}}@media(max-width:600px){.wrap{padding:10px}.topbar{padding:10px}.filters,.cards,.rooms,.checkgrid{grid-template-columns:1fr}.brand small{display:none}}
</style></head><body>
<div id="login" class="login hide"><div class="loginbox"><h1>Controle de Cirurgias Eletivas</h1><div class="field"><label>E-mail</label><input id="loginEmail" type="email"></div><div class="field"><label>Senha</label><input id="loginPass" type="password"></div><button class="btn primary" onclick="loginNow()">Entrar</button><div id="loginMsg" class="sub" style="margin-top:10px"></div></div></div>
<div id="shell" class="hide"><header class="topbar"><div class="brand"><div class="brand-icon">🏥</div><div><h1>Hospital São José</h1><small>Gestão Operacional de Centros Cirúrgicos & Regulação</small></div></div><div class="top-actions"><button class="btn" onclick="downloadBackup()">⬇ Baixar Backup CSV</button><button class="btn" onclick="logout()">🚪 Sair</button></div></header><div class="wrap"><section class="filterbar"><div class="filter-title">FILTROS GERAIS</div><div class="filters"><input id="gfName" placeholder="Nome / CPF / IDS" oninput="renderCurrent()"><select id="gfDoctor" onchange="renderCurrent()"><option value="">Todos os médicos</option></select><input id="gfProcedure" placeholder="Procedimento" oninput="renderCurrent()"><input id="gfDate" type="date" onchange="renderCurrent()"><select id="gfSpecialty" onchange="renderCurrent()"><option value="">Especialidade</option></select><select id="gfStatus" onchange="renderCurrent()"><option value="">Situação</option></select></div></section><nav id="tabs" class="tabs"></nav><main id="content"></main></div></div><div id="modal"></div>
<script>
const URL='https://uulsxmdycbihwkbftcdv.supabase.co',KEY='sb_publishable_odmXzemIQZwx1BxrJiUYnQ_iZfPVHlV';
let token=localStorage.getItem('sb_access_token'),uid=null;let S={rows:[],profile:null,view:'fila',mapMode:'daily',room:'all'};
const stageOrder=['fila','pendencias','consulta_preop','exames','entrevista_tecnico','avaliacao_enfermeiro','mapa_cirurgico','pos_operatorio','concluida'];
const labels={fila:'Fila de Cirurgia',pendencias:'Pendências',consulta_preop:'Agendamento / Consulta Pré-Op',duploj:'Acompanhamento de Duplo J',exames:'Exames (NIR)',entrevista_tecnico:'Triagem Enfermagem',avaliacao_enfermeiro:'Avaliação Enfermeiro',mapa_cirurgico:'Mapa Cirúrgico',suspensas:'Suspensas',pos_operatorio:'Pós-Operatório',indicadores:'Indicadores'};
const views=['fila','pendencias','consulta_preop','duploj','exames','entrevista_tecnico','avaliacao_enfermeiro','mapa_cirurgico','suspensas','pos_operatorio','indicadores'];
const patientStatuses=['SOLICITADO','PENDENTE','AGUARDANDO ATENDIMENTO','NEGADO','DEVOLVIDO','REALIZADA','AUTORIZADA','ÓBITO','EXCLUÍDO','DESISTÊNCIA','SUSPENSA','ARQUIVADO','PENDENTE PRE OP','SOLICITADO REVALIDAÇÃO'];
const exams=['Hemograma','Coagulograma','Ureia','Creatinina','Raio X de Tórax','US de Abdômen','Tomografia de Abdômen','Tomografia de Tórax'];
const nurseItems=['Estado geral preservado','Orientado e comunicativo','Sem febre','Sem tosse','Sem dispneia','Sem sintomas urinários','Sem sintomas gastrointestinais','Pressão arterial controlada','Glicemia controlada','Jejum orientado','Acompanhante confirmado','Exames conferidos','Documentação conferida','Apto para seguir o fluxo','Necessita reavaliação'];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function jwt(){try{return JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch{return{}}}
async function api(path,opt={}){const r=await fetch(URL+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'return=representation',...(opt.headers||{})}});const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch{j=t}if(r.status===401){localStorage.clear();showLogin();throw new Error('Sessão expirada')}if(!r.ok)throw new Error(j?.message||j?.error||String(j||r.status));return j}
async function loginNow(){try{const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('loginEmail').value.trim(),password:document.getElementById('loginPass').value})});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||j.message);token=j.access_token;localStorage.setItem('sb_access_token',token);localStorage.setItem('sb_refresh_token',j.refresh_token||'');await boot()}catch(e){document.getElementById('loginMsg').textContent=e.message}}
function showLogin(){login.classList.remove('hide');shell.classList.add('hide')}function logout(){localStorage.clear();location.reload()}
async function boot(){if(!token)return showLogin();uid=jwt().sub;try{let p=await api('/rest/v1/profiles?id=eq.'+uid+'&select=*');S.profile=p?.[0];if(!S.profile?.approved)return alert('Acesso ainda não aprovado.');login.classList.add('hide');shell.classList.remove('hide');renderTabs();await load();fillFilters();renderCurrent()}catch(e){alert(e.message);showLogin()}}
async function load(){S.rows=await api('/rest/v1/surgeries?select=*&active=eq.true&order=created_at.desc&limit=5000')||[]}
function renderTabs(){tabs.innerHTML=views.map(v=>`<button class="tab ${v===S.view?'on':''}" onclick="setView('${v}',this)">${labels[v]}</button>`).join('')}
function setView(v,el){S.view=v;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));el.classList.add('on');renderCurrent()}
function fillFilters(){const docs=[...new Set(S.rows.map(x=>x.surgeon).filter(Boolean))].sort(),spec=[...new Set(S.rows.map(x=>x.specialty).filter(Boolean))].sort();document.getElementById('gfDoctor').innerHTML='<option value="">Todos os médicos</option>'+docs.map(x=>`<option>${esc(x)}</option>`).join('');document.getElementById('gfSpecialty').innerHTML='<option value="">Especialidade</option>'+spec.map(x=>`<option>${esc(x)}</option>`).join('');document.getElementById('gfStatus').innerHTML='<option value="">Situação</option>'+patientStatuses.map(x=>`<option>${x}</option>`).join('')}
function filtered(rows){let q=document.getElementById('gfName').value.trim().toLowerCase(),d=document.getElementById('gfDoctor').value,p=document.getElementById('gfProcedure').value.trim().toLowerCase(),dt=document.getElementById('gfDate').value,sp=document.getElementById('gfSpecialty').value,st=document.getElementById('gfStatus').value;return rows.filter(x=>(!q||[x.patient_name,x.cpf,x.ids].some(v=>String(v||'').toLowerCase().includes(q)))&&(!d||x.surgeon===d)&&(!p||String(x.procedure_name||'').toLowerCase().includes(p))&&(!sp||x.specialty===sp)&&(!st||x.patient_status===st)&&(!dt||[x.aih_request_date,x.consultation_date,x.programming_date,x.surgery_date,x.authorization_date].includes(dt)))}
function stageRows(stage){return filtered(S.rows.filter(x=>x.stage===stage))}function suspendRows(){return filtered(S.rows.filter(x=>x.patient_status==='SUSPENSA'))}
function renderCurrent(){if(!content)return;if(S.view==='consulta_preop')return renderConsult();if(S.view==='duploj')return renderDoubleJ();if(S.view==='exames')return renderExams();if(S.view==='entrevista_tecnico')return renderTriage();if(S.view==='avaliacao_enfermeiro')return renderNurse();if(S.view==='mapa_cirurgico')return renderMap();if(S.view==='indicadores')return renderIndicators();if(S.view==='suspensas')return renderGeneric(suspendRows(),'Suspensas');return renderGeneric(stageRows(S.view),labels[S.view])}
function statusPill(x){let c=x==='SUSPENSA'?'bad':x==='REALIZADA'||x==='AUTORIZADA'?'ok':'warn';return `<span class="pill ${c}">${esc(x||'')}</span>`}
function actionButtons(x){return `<div class="acts"><button class="btn small" onclick="editPatient('${x.id}')">✏ Editar</button><button class="btn green small" onclick="nextStage('${x.id}')">➡ Próxima etapa</button><button class="btn orange small" onclick="suspendPatient('${x.id}')">⚠ Suspensa</button><button class="btn red small" onclick="deletePatient('${x.id}')">🗑 Excluir</button></div>`}
function baseTable(rows){return `<div class="tablewrap"><table class="table"><thead><tr><th class="actions">AÇÕES RÁPIDAS</th><th>NOME</th><th>IDS</th><th>CPF</th><th>CONTATO</th><th>PROCEDIMENTO</th><th>ESPECIALIDADE</th><th>MÉDICO</th><th>SITUAÇÃO</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td>${actionButtons(x)}</td><td><b>${esc(x.patient_name)}</b></td><td>${esc(x.ids||'')}</td><td>${esc(x.cpf||'')}</td><td>${esc(x.phone||'')}</td><td>${esc(x.procedure_name||'')}</td><td>${esc(x.specialty||'')}</td><td>${esc(x.surgeon||'')}</td><td>${statusPill(x.patient_status)}</td></tr>`).join(''):'<tr><td colspan="9" style="text-align:center;padding:28px">Nenhum registro encontrado.</td></tr>'}</tbody></table></div>`}
function renderGeneric(rows,title){document.getElementById('content').innerHTML=`<section class="card"><div class="section-head"><div><h2>📋 ${title} (${rows.length} pacientes)</h2><div class="sub">Fluxo compartilhado entre as máquinas</div></div><button class="btn primary" onclick="editPatient()">+ Novo Paciente</button></div><div class="notice">Use “Próxima etapa” para avançar o paciente. Ações críticas possuem dupla confirmação.</div>${baseTable(rows)}</section>`}
function field(label,id,val='',type='text',cls=''){return `<div class="field ${cls}"><label>${label}</label><input id="f_${id}" type="${type}" value="${esc(val||'')}"></div>`}
function selectField(label,id,val,opts,cls=''){return `<div class="field ${cls}"><label>${label}</label><select id="f_${id}"><option value=""></option>${opts.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`}
function editPatient(id=''){let x=id?S.rows.find(r=>r.id===id):{};document.getElementById('modal').innerHTML=`<div class="back"><div class="modal"><div class="mh"><b>✏ ${id?'Editar Paciente: '+esc(x.patient_name):'Novo Paciente'}</b><button class="btn" onclick="document.getElementById('modal').innerHTML=''">Fechar</button></div><div class="mb"><div class="grid">${field('NOME COMPLETO *','patient_name',x.patient_name)}${field('IDS','ids',x.ids)}${field('CPF','cpf',x.cpf)}${field('CONTATO / WHATSAPP','phone',x.phone)}${field('DATA DE SOLICITAÇÃO DO AIH','aih_request_date',x.aih_request_date,'date')}${field('DATA CADASTRO IDS','ids_register_date',x.ids_register_date,'date')}${field('PROCEDIMENTO CIRÚRGICO *','procedure_name',x.procedure_name,'text','span2')}${field('CÓDIGO DO PROCEDIMENTO','sigtap_code',x.sigtap_code)}${field('TIPO DE SOLICITAÇÃO','request_type',x.request_type)}${field('ESPECIALIDADE','specialty',x.specialty)}${field('MÉDICO CIRURGIÃO','surgeon',x.surgeon)}${field('DATA DE NASCIMENTO','birth_date',x.birth_date,'date')}${field('DATA DA AUTORIZAÇÃO','authorization_date',x.authorization_date,'date')}${field('MÊS DA AUTORIZAÇÃO','authorization_month',x.authorization_month)}${field('DATA DA PROGRAMAÇÃO','programming_date',x.programming_date,'date')}${selectField('SITUAÇÃO DO PACIENTE','patient_status',x.patient_status,patientStatuses)}${field('SITUAÇÃO DA SOLICITAÇÃO','request_status',x.request_status)}${field('DATA DA REMARCAÇÃO','reschedule_date',x.reschedule_date,'date')}${field('DATA DA CIRURGIA','surgery_date',x.surgery_date,'date')}<div class="field span3"><label>SUSPENSÃO / OBSERVAÇÕES</label><textarea id="f_suspension_notes">${esc(x.suspension_notes||'')}</textarea></div></div></div><div class="mf"><button class="btn primary" onclick="savePatient('${id}')">Gravar Alterações</button></div></div></div>`}
async function savePatient(id){const keys=['patient_name','ids','cpf','phone','aih_request_date','ids_register_date','procedure_name','sigtap_code','request_type','specialty','surgeon','birth_date','authorization_date','authorization_month','programming_date','patient_status','request_status','reschedule_date','surgery_date','suspension_notes'];let d={updated_by:uid};keys.forEach(k=>d[k]=document.getElementById('f_'+k)?.value||null);if(!d.patient_name||!d.procedure_name)return alert('Nome e procedimento são obrigatórios.');if(id)await api('/rest/v1/surgeries?id=eq.'+id,{method:'PATCH',body:JSON.stringify(d)});else await api('/rest/v1/surgeries',{method:'POST',body:JSON.stringify({...d,stage:'fila',created_by:uid})});document.getElementById('modal').innerHTML='';await load();fillFilters();renderCurrent()}
function confirm2(a,b){return confirm(a)&&confirm(b)}
async function nextStage(id){let x=S.rows.find(r=>r.id===id),i=stageOrder.indexOf(x.stage);if(i<0||i>=stageOrder.length-1)return alert('Este paciente já está na última etapa.');let to=stageOrder[i+1];if(!confirm2(`Deseja enviar ${x.patient_name} para a próxima etapa?`,`Confirma a mudança para “${labels[to]||to}”?`))return;await api('/rest/v1/surgeries?id=eq.'+id,{method:'PATCH',body:JSON.stringify({stage:to,updated_by:uid})});await load();renderCurrent()}
async function suspendPatient(id){let x=S.rows.find(r=>r.id===id);if(!confirm2(`Deseja marcar ${x.patient_name} como SUSPENSA?`,'Confirma a alteração da situação para SUSPENSA?'))return;let reason=prompt('Motivo da suspensão (recomendado para os indicadores):')||x.suspension_notes||'';await api('/rest/v1/surgeries?id=eq.'+id,{method:'PATCH',body:JSON.stringify({patient_status:'SUSPENSA',suspension_notes:reason,updated_by:uid})});await load();renderCurrent()}
async function deletePatient(id){let x=S.rows.find(r=>r.id===id);if(!confirm2(`Deseja excluir ${x.patient_name} do sistema?`,'CONFIRMA A EXCLUSÃO DEFINITIVA? Essa ação não poderá ser desfeita.'))return;await api('/rest/v1/surgeries?id=eq.'+id,{method:'DELETE'});await load();renderCurrent()}
function renderConsult(){let rows=stageRows('consulta_preop');document.getElementById('content').innerHTML=`<section class="card"><div class="section-head"><div><h2>📅 Agendamento de Consultas Pré-Operatórias</h2><div class="sub">Modelo operacional com acompanhamento de Duplo J</div></div></div>${consultTable(rows)}</section>`}
function consultTable(rows){return `<div class="tablewrap"><table class="table"><thead><tr><th class="actions">AÇÕES</th><th>DATA AGENDAMENTO</th><th>NOME DO PACIENTE</th><th>DATA CONSULTA</th><th>HORÁRIO</th><th>MÉDICO</th><th>UNIDADE PROVENIENTE</th><th>RESPONSÁVEL</th><th>DUPLO J</th><th>DATA INSERÇÃO</th><th>TELEFONE</th><th>OBSERVAÇÕES</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td>${actionButtons(x)} <button class="btn small" onclick="editConsult('${x.id}')">📅 Agenda</button></td><td>${esc(x.appointment_date||'')}</td><td><b>${esc(x.patient_name)}</b></td><td>${esc(x.consultation_date||'')}</td><td>${esc(x.consultation_time||'')}</td><td>${esc(x.surgeon||'')}</td><td>${esc(x.source_unit||'')}</td><td>${esc(x.appointment_responsible||'')}</td><td>${x.double_j?'SIM':'NÃO'}</td><td>${esc(x.double_j_insert_date||'')}</td><td>${esc(x.phone||'')}</td><td>${esc(x.consultation_notes||'')}</td></tr>`).join(''):'<tr><td colspan="12" style="text-align:center;padding:28px">Nenhum paciente nesta etapa.</td></tr>'}</tbody></table></div>`}
function editConsult(id){let x=S.rows.find(r=>r.id===id);document.getElementById('modal').innerHTML=`<div class="back"><div class="modal"><div class="mh"><b>📅 Agendamento: ${esc(x.patient_name)}</b><button class="btn" onclick="document.getElementById('modal').innerHTML=''">Fechar</button></div><div class="mb"><div class="grid">${field('Data do agendamento','appointment_date',x.appointment_date,'date')}${field('Data da consulta','consultation_date',x.consultation_date,'date')}${field('Horário','consultation_time',x.consultation_time,'time')}${field('Médico','surgeon',x.surgeon)}${field('Unidade proveniente','source_unit',x.source_unit)}${field('Responsável pelo agendamento','appointment_responsible',x.appointment_responsible)}${selectField('Duplo J','double_j',x.double_j?'SIM':'NÃO',['NÃO','SIM'])}${field('Data de inserção do Duplo J','double_j_insert_date',x.double_j_insert_date,'date')}<div class="field span3"><label>Observações</label><textarea id="f_consultation_notes">${esc(x.consultation_notes||'')}</textarea></div></div></div><div class="mf"><button class="btn primary" onclick="saveConsult('${id}')">Salvar</button></div></div></div>`}
async function saveConsult(id){let dj=document.getElementById('f_double_j').value==='SIM';let d={appointment_date:document.getElementById('f_appointment_date').value||null,consultation_date:document.getElementById('f_consultation_date').value||null,consultation_time:document.getElementById('f_consultation_time').value||null,surgeon:document.getElementById('f_surgeon').value||null,source_unit:document.getElementById('f_source_unit').value||null,appointment_responsible:document.getElementById('f_appointment_responsible').value||null,double_j:dj,double_j_insert_date:dj?(document.getElementById('f_double_j_insert_date').value||null):null,consultation_notes:document.getElementById('f_consultation_notes').value||null,updated_by:uid};await api('/rest/v1/surgeries?id=eq.'+id,{method:'PATCH',body:JSON.stringify(d)});document.getElementById('modal').innerHTML='';await load();renderConsult()}
function renderDoubleJ(){let rows=filtered(S.rows.filter(x=>x.double_j));document.getElementById('content').innerHTML=`<section class="card"><div class="section-head"><div><h2>🩺 Acompanhamento de Duplo J (${rows.length})</h2><div class="sub">Controle de pacientes com Duplo J</div></div></div><div class="tablewrap"><table class="table"><thead><tr><th class="actions">AÇÕES</th><th>PACIENTE</th><th>IDS</th><th>MÉDICO</th><th>DATA INSERÇÃO</th><th>PROCEDIMENTO</th><th>ETAPA ATUAL</th><th>OBSERVAÇÕES</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${actionButtons(x)}</td><td><b>${esc(x.patient_name)}</b></td><td>${esc(x.ids||'')}</td><td>${esc(x.surgeon||'')}</td><td>${esc(x.double_j_insert_date||'')}</td><td>${esc(x.procedure_name||'')}</td><td>${esc(labels[x.stage]||x.stage)}</td><td>${esc(x.consultation_notes||'')}</td></tr>`).join('')||'<tr><td colspan="8" style="text-align:center;padding:28px">Nenhum paciente com Duplo J.</td></tr>'}</tbody></table></div></section>`}
function renderExams(){let rows=stageRows('exames');document.getElementById('content').innerHTML=`<section class="card"><div class="section-head"><div><h2>🧪 Exames (NIR)</h2><div class="sub">Checklist de exames e sinalização de pendências</div></div></div><div class="tablewrap"><table class="table"><thead><tr><th class="actions">AÇÕES</th><th>PACIENTE</th><th>MÉDICO</th><th>PROCEDIMENTO</th><th>PENDÊNCIA</th><th>OBSERVAÇÕES</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${actionButtons(x)} <button class="btn small" onclick="editExams('${x.id}')">🧪 Exames</button></td><td><b>${esc(x.patient_name)}</b></td><td>${esc(x.surgeon||'')}</td><td>${esc(x.procedure_name||'')}</td><td>${x.exam_pending?'<span class="pill bad">SIM</span>':'<span class="pill ok">NÃO</span>'}</td><td>${esc(x.exam_observations||'')}</td></tr>`).join('')||'<tr><td colspan="6" style="text-align:center;padding:28px">Nenhum paciente nesta etapa.</td></tr>'}</tbody></table></div></section>`}
function editExams(id){let x=S.rows.find(r=>r.id===id),ck=x.exam_checklist||{};document.getElementById('modal').innerHTML=`<div class="back"><div class="modal"><div class="mh"><b>🧪 Exames: ${esc(x.patient_name)}</b><button class="btn" onclick="document.getElementById('modal').innerHTML=''">Fechar</button></div><div class="mb"><div class="checkgrid">${exams.map((e,i)=>`<label class="check"><input id="ex_${i}" type="checkbox" ${ck[e]?'checked':''}> ${e}</label>`).join('')}</div><div class="grid" style="margin-top:12px">${field('Outro exame','exam_other',x.exam_other,'text','span2')}${selectField('Possui pendência?','exam_pending',x.exam_pending?'SIM':'NÃO',['NÃO','SIM'])}<div class="field span3"><label>Observações / Pendências</label><textarea id="f_exam_observations">${esc(x.exam_observations||'')}</textarea></div></div></div><div class="mf"><button class="btn primary" onclick="saveExams('${id}')">Salvar exames</button></div></div></div>`}
async function saveExams(id){let ck={};exams.forEach((e,i)=>ck[e]=document.getElementById('ex_'+i).checked);let d={exam_checklist:ck,exam_other:document.getElementById('f_exam_other').value||null,exam_pending:document.getElementById('f_exam_pending').value==='SIM',exam_observations:document.getElementById('f_exam_observations').value||null,updated_by:uid};await api('/rest/v1/surgeries?id=eq.'+id,{method:'PATCH',body:JSON.stringify(d)});document.getElementById('modal').innerHTML='';await load();renderExams()}
const triageQ=[['sintomas','Nas últimas duas semanas, apresentou febre, tosse, dor de garganta, coriza ou falta de ar?'],['gi_urina','Apresentou diarreia, vômito ou infecção urinária recentemente?'],['pa_glicemia','Houve alguma alteração na pressão arterial ou glicemia nos últimos dias?'],['medicamentos','Quais medicamentos toma diariamente?'],['suspensao_meds','O médico orientou suspender algum remédio? O paciente seguiu a orientação?'],['alergias','Possui alergia conhecida a medicamentos, látex ou alimentos?'],['cirurgias_previas','Já realizou cirurgias antes?'],['jejum','Orientações de jejum de sólidos e líquidos reforçadas?'],['acompanhante','Acompanhante obrigatório confirmado?'],['documentos','Orientado a trazer exames impressos, documentos e itens pessoais?']];
function renderTriage(){let rows=stageRows('entrevista_tecnico');document.getElementById('content').innerHTML=`<section class="card"><div class="section-head"><div><h2>☎ Triagem de Enfermagem</h2><div class="sub">Entrevista estruturada com rastreabilidade do profissional</div></div></div>${baseTriage(rows)}</section>`}
function baseTriage(rows){return `<div class="tablewrap"><table class="table"><thead><tr><th class="actions">AÇÕES</th><th>PACIENTE</th><th>MÉDICO</th><th>PROCEDIMENTO</th><th>ENTREVISTADOR</th><th>DATA/HORA</th><th>JUSTIFICATIVA AO ENFERMEIRO</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${actionButtons(x)} <button class="btn small" onclick="editTriage('${x.id}')">☎ Entrevista</button></td><td><b>${esc(x.patient_name)}</b></td><td>${esc(x.surgeon||'')}</td><td>${esc(x.procedure_name||'')}</td><td>${esc(x.triage_by?'Registrado':'')}</td><td>${esc(x.triage_at||'')}</td><td>${esc(x.nurse_referral_reason||'')}</td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;padding:28px">Nenhum paciente nesta etapa.</td></tr>'}</tbody></table></div>`}
function editTriage(id){let x=S.rows.find(r=>r.id===id),a=x.triage_answers||{};document.getElementById('modal').innerHTML=`<div class="back"><div class="modal"><div class="mh"><b>☎ Triagem: ${esc(x.patient_name)}</b><button class="btn" onclick="document.getElementById('modal').innerHTML=''">Fechar</button></div><div class="mb">${triageQ.map(([k,q],i)=>`<div class="field" style="margin-bottom:10px"><label>${i+1}. ${q}</label>${['medicamentos','suspensao_meds','alergias','cirurgias_previas'].includes(k)?`<textarea id="t_${k}">${esc(a[k]||'')}</textarea>`:`<select id="t_${k}"><option></option><option ${a[k]==='SIM'?'selected':''}>SIM</option><option ${a[k]==='NÃO'?'selected':''}>NÃO</option></select>`}</div>`).join('')}<div class="field"><label>Observações da triagem</label><textarea id="t_notes">${esc(x.triage_notes||'')}</textarea></div><div class="field" style="margin-top:12px"><label>Justificativa para encaminhar ao enfermeiro *</label><textarea id="t_reason">${esc(x.nurse_referral_reason||'')}</textarea></div></div><div class="mf"><button class="btn" onclick="saveTriage('${id}',false)">Salvar</button><button class="btn green" onclick="saveTriage('${id}',true)">Encaminhar para o Enfermeiro</button></div></div></div>`}
async function saveTriage(id,forward){let answers={};triageQ.forEach(([k])=>answers[k]=document.getElementById('t_'+k).value||'');let reason=document.getElementById('t_reason').value.trim();if(forward&&!reason)return alert('A justificativa é obrigatória para encaminhar ao enfermeiro.');let d={triage_answers:answers,triage_notes:document.getElementById('t_notes').value||null,triage_by:uid,triage_at:new Date().toISOString(),nurse_referral_reason:reason||null,updated_by:uid};if(forward)d.stage='avaliacao_enfermeiro';await api('/rest/v1/surgeries?id=eq.'+id,{method:'PATCH',body:JSON.stringify(d)});document.getElementById('modal').innerHTML='';await load();renderCurrent()}
function renderNurse(){let rows=stageRows('avaliacao_enfermeiro');document.getElementById('content').innerHTML=`<section class="card"><div class="section-head"><div><h2>🩺 Avaliação do Enfermeiro</h2><div class="sub">Checklist de exame físico por telefone</div></div></div><div class="tablewrap"><table class="table"><thead><tr><th class="actions">AÇÕES</th><th>PACIENTE</th><th>MÉDICO</th><th>PROCEDIMENTO</th><th>AVALIAÇÃO</th><th>OBSERVAÇÕES</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${actionButtons(x)} <button class="btn small" onclick="editNurse('${x.id}')">🩺 Checklist</button></td><td><b>${esc(x.patient_name)}</b></td><td>${esc(x.surgeon||'')}</td><td>${esc(x.procedure_name||'')}</td><td>${esc(x.nurse_at||'')}</td><td>${esc(x.nurse_observations||'')}</td></tr>`).join('')||'<tr><td colspan="6" style="text-align:center;padding:28px">Nenhum paciente nesta etapa.</td></tr>'}</tbody></table></div></section>`}
function editNurse(id){let x=S.rows.find(r=>r.id===id),ck=x.nurse_checklist||{};document.getElementById('modal').innerHTML=`<div class="back"><div class="modal"><div class="mh"><b>🩺 Avaliação: ${esc(x.patient_name)}</b><button class="btn" onclick="document.getElementById('modal').innerHTML=''">Fechar</button></div><div class="mb"><div class="notice">Justificativa recebida da triagem: <b>${esc(x.nurse_referral_reason||'—')}</b></div><div class="checkgrid">${nurseItems.map((e,i)=>`<label class="check"><input id="n_${i}" type="checkbox" ${ck[e]?'checked':''}> ${e}</label>`).join('')}</div><div class="field" style="margin-top:12px"><label>Observações do enfermeiro</label><textarea id="n_notes">${esc(x.nurse_observations||'')}</textarea></div></div><div class="mf"><button class="btn primary" onclick="saveNurse('${id}')">Salvar avaliação</button></div></div></div>`}
async function saveNurse(id){let ck={};nurseItems.forEach((e,i)=>ck[e]=document.getElementById('n_'+i).checked);await api('/rest/v1/surgeries?id=eq.'+id,{method:'PATCH',body:JSON.stringify({nurse_checklist:ck,nurse_observations:document.getElementById('n_notes').value||null,nurse_by:uid,nurse_at:new Date().toISOString(),updated_by:uid})});document.getElementById('modal').innerHTML='';await load();renderNurse()}
function renderMap(){let rows=stageRows('mapa_cirurgico'),date=document.getElementById('gfDate').value||new Date().toISOString().slice(0,10);document.getElementById('content').innerHTML=`<section class="card"><div class="section-head"><div><h2>🏥 Mapa Cirúrgico</h2><div class="sub">Salas e leitos — visão diária e escala mensal acumulada</div></div><button class="btn" onclick="window.print()">🖨 Imprimir Relatório</button></div><div class="map-modes"><button class="btn ${S.mapMode==='daily'?'primary':''}" onclick="S.mapMode='daily';renderMap()">🗓 Visão Diária (Macro do Dia)</button><button class="btn ${S.mapMode==='monthly'?'primary':''}" onclick="S.mapMode='monthly';renderMap()">📊 Visão Escala Mensal Acumulada</button></div><div class="cards"><div class="kpi"><div class="label">CIRURGIAS ESCALADAS</div><div class="value">${rows.filter(x=>x.surgery_date&&(S.mapMode==='monthly'?x.surgery_date.slice(0,7)===date.slice(0,7):x.surgery_date===date)).length}</div></div><div class="kpi orange"><div class="label">PACIENTES NO MAPA</div><div class="value">${rows.length}</div></div></div><div class="mini-tabs"><button class="mini-tab ${S.room==='all'?'on':''}" onclick="S.room='all';renderMap()">Visão Geral Simultânea</button>${[1,2,3,4].map(n=>`<button class="mini-tab ${S.room==String(n)?'on':''}" onclick="S.room='${n}';renderMap()">Sala 0${n}</button>`).join('')}</div>${S.room==='all'?`<div class="rooms">${[1,2,3,4].map(n=>roomCard(n,rows)).join('')}</div>`:roomTable(S.room,rows)}</section>`}
function roomCard(n,rows){let rr=rows.filter(x=>String(x.map_room||'').replace(/\D/g,'')==String(n));return `<div class="room"><h3>🚪 Sala 0${n}</h3><div class="body">${rr.length?rr.slice(0,4).map(x=>`<div><b>${esc(x.patient_name)}</b> — ${esc(x.surgeon||'')}</div>`).join(''):'Nenhum agendamento'}</div></div>`}
function roomTable(n,rows){let rr=rows.filter(x=>String(x.map_room||'').replace(/\D/g,'')==String(n));return `<div class="section-head" style="margin:12px 0"><h2>Escala — Sala 0${n}</h2></div><div class="tablewrap"><table class="table"><thead><tr><th class="actions">AÇÕES</th><th>NOME</th><th>IDS</th><th>PROCEDIMENTO</th><th>MÉDICO</th><th>DATA CIRURGIA</th><th>RESERVAS ESPECIAIS</th><th>RESPONSÁVEL</th></tr></thead><tbody>${rr.map(x=>`<tr><td>${actionButtons(x)} <button class="btn small" onclick="editMapPatient('${x.id}')">🏥 Mapa</button></td><td>${esc(x.patient_name)}</td><td>${esc(x.ids||'')}</td><td>${esc(x.procedure_name||'')}</td><td>${esc(x.surgeon||'')}</td><td>${esc(x.surgery_date||'')}</td><td>${esc(x.map_reservations||'')}</td><td>${esc(x.map_responsible||'')}</td></tr>`).join('')||'<tr><td colspan="8" style="text-align:center;padding:28px">Nenhum paciente alocado nesta sala.</td></tr>'}</tbody></table></div>`}
function editMapPatient(id){let x=S.rows.find(r=>r.id===id);document.getElementById('modal').innerHTML=`<div class="back"><div class="modal"><div class="mh"><b>🏥 Mapa: ${esc(x.patient_name)}</b><button class="btn" onclick="document.getElementById('modal').innerHTML=''">Fechar</button></div><div class="mb"><div class="grid">${selectField('Sala','map_room',x.map_room,['Sala 01','Sala 02','Sala 03','Sala 04'])}${field('Data da cirurgia','surgery_date',x.surgery_date,'date')}${field('Responsável','map_responsible',x.map_responsible)}<div class="field span3"><label>Reservas especiais</label><textarea id="f_map_reservations">${esc(x.map_reservations||'')}</textarea></div></div></div><div class="mf"><button class="btn primary" onclick="saveMapPatient('${id}')">Salvar</button></div></div></div>`}
async function saveMapPatient(id){await api('/rest/v1/surgeries?id=eq.'+id,{method:'PATCH',body:JSON.stringify({map_room:document.getElementById('f_map_room').value||null,surgery_date:document.getElementById('f_surgery_date').value||null,map_responsible:document.getElementById('f_map_responsible').value||null,map_reservations:document.getElementById('f_map_reservations').value||null,updated_by:uid})});document.getElementById('modal').innerHTML='';await load();renderMap()}
function days(a,b){if(!a||!b)return null;let d=(new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000;return isFinite(d)&&d>=0?Math.round(d):null}function avg(a){let v=a.filter(x=>x!=null);return v.length?Math.round(v.reduce((s,x)=>s+x,0)/v.length):null}
function groupAvg(rows,key,fn){let m={};rows.forEach(x=>{let k=x[key]||'Não informado',v=fn(x);if(v!=null)(m[k]??=[]).push(v)});return Object.entries(m).map(([k,v])=>[k,avg(v),v.length]).sort((a,b)=>b[1]-a[1])}
function renderIndicators(){let rows=filtered(S.rows),wait=x=>days(x.aih_request_date,x.surgery_date||x.programming_date||new Date().toISOString().slice(0,10)),auth=x=>days(x.authorization_date,x.surgery_date||x.programming_date);let geral=avg(rows.map(wait)),aavg=avg(rows.map(auth));let gs=groupAvg(rows,'specialty',wait),gd=groupAvg(rows,'surgeon',wait),gp=groupAvg(rows,'procedure_name',wait);document.getElementById('content').innerHTML=`<section class="card"><div class="section-head"><div><h2>📊 Indicadores de Gestão</h2><div class="sub">Filtros gerais aplicados a todos os painéis</div></div><div><button class="btn" onclick="downloadIndicators()">⬇ Baixar Indicadores CSV</button> <button class="btn" onclick="window.print()">🖨 Imprimir</button></div></div><div class="cards"><div class="kpi"><div class="label">PACIENTES FILTRADOS</div><div class="value">${rows.length}</div></div><div class="kpi orange"><div class="label">TEMPO MÉDIO DE ESPERA</div><div class="value">${geral??'—'}${geral!=null?' d':''}</div></div><div class="kpi green"><div class="label">AUTORIZAÇÃO → PROCEDIMENTO</div><div class="value">${aavg??'—'}${aavg!=null?' d':''}</div></div><div class="kpi teal"><div class="label">SUSPENSOS</div><div class="value">${rows.filter(x=>x.patient_status==='SUSPENSA').length}</div></div></div>${barChart('Tempo médio por especialidade',gs)}${barChart('Tempo médio por médico',gd.slice(0,15))}${barChart('Tempo médio por procedimento',gp.slice(0,15))}<div class="chart"><h3>Aging da fila</h3>${aging(rows,wait)}</div></section>`}
function barChart(title,data){let max=Math.max(1,...data.map(x=>x[1]||0));return `<div class="chart"><h3>${title}</h3>${data.length?data.map(([k,v,n])=>`<div class="barrow"><span title="${esc(k)}">${esc(k.length>28?k.slice(0,28)+'…':k)}</span><div class="bar"><i style="width:${Math.max(2,(v/max)*100)}%"></i></div><b>${v} d</b></div>`).join(''):'<div class="sub">Sem dados suficientes.</div>'}</div>`}
function aging(rows,fn){let bins=[['0–15',0,15],['16–30',16,30],['31–60',31,60],['61–90',61,90],['91–180',91,180],['>180',181,99999]];return bins.map(([l,a,b])=>{let n=rows.filter(x=>{let d=fn(x);return d!=null&&d>=a&&d<=b}).length;return `<div class="barrow"><span>${l} dias</span><div class="bar"><i style="width:${rows.length?(n/rows.length*100):0}%"></i></div><b>${n}</b></div>`}).join('')}
function downloadIndicators(){let rows=filtered(S.rows),lines=[['Paciente','IDS','Médico','Especialidade','Procedimento','Data AIH','Data autorização','Data programação','Data cirurgia','Situação','Etapa','Espera (dias)','Autorização→procedimento (dias)']];rows.forEach(x=>lines.push([x.patient_name,x.ids,x.surgeon,x.specialty,x.procedure_name,x.aih_request_date,x.authorization_date,x.programming_date,x.surgery_date,x.patient_status,x.stage,days(x.aih_request_date,x.surgery_date||x.programming_date||new Date().toISOString().slice(0,10)),days(x.authorization_date,x.surgery_date||x.programming_date)]));downloadCsv('indicadores_cirurgicos.csv',lines)}
function downloadBackup(){let keys=['patient_name','ids','cpf','phone','aih_request_date','ids_register_date','procedure_name','sigtap_code','request_type','specialty','surgeon','birth_date','authorization_date','authorization_month','programming_date','patient_status','request_status','reschedule_date','surgery_date','stage'];let lines=[keys];S.rows.forEach(x=>lines.push(keys.map(k=>x[k]??'')));downloadCsv('backup_cirurgias.csv',lines)}
function downloadCsv(name,rows){let csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n'),a=document.createElement('a');a.href=window.URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>window.URL.revokeObjectURL(a.href),1000)}
boot();
</script></body></html>
