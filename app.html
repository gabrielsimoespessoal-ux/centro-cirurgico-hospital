<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Controle de Cirurgias Eletivas</title><style>
:root{--bg:#f3f5f8;--panel:#fff;--line:#d9dee7;--text:#20242c;--muted:#657084;--brand:#0959b8;--danger:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Arial,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.btn{border:0;border-radius:6px;padding:9px 14px;font-weight:700;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:#fff;border:1px solid #c7ced8}.small{padding:6px 8px;font-size:12px}.system-header{margin:20px 20px 0;background:var(--brand);color:#fff;border-radius:8px;padding:18px 26px;display:flex;justify-content:space-between;gap:16px}.system-title{font-size:22px;font-weight:800}.system-user{font-size:13px;opacity:.9;margin-top:4px}.stagebar{margin:20px;background:#fff;border:1px solid #e1e5ea;border-radius:10px;padding:10px;display:flex;gap:5px;overflow-x:auto}.nav{white-space:nowrap;border:0;border-radius:5px;background:#e8ebef;padding:10px 14px;font-weight:700;cursor:pointer}.nav.on{background:var(--brand);color:#fff}.nav.exit{margin-left:auto}.main{padding:0 20px 28px}.content-card{background:#fff;border:1px solid #e3e7ed;border-radius:10px;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.muted{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;background:#f9fafb;padding:10px;border:1px solid #e1e5ea;border-radius:8px;margin:16px 0}.toolbar input,.toolbar select{padding:8px;border:1px solid #cbd2dc;border-radius:6px}.notice{padding:9px 12px;border-left:4px solid var(--brand);background:#eef5ff;font-size:12px;margin:10px 0}.tablewrap{overflow:auto;border:1px solid #d9dee7;border-radius:7px}.table{width:100%;min-width:1500px;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #edf0f4;text-align:left;font-size:12px}.table th{background:#e9eef5;font-size:10px;text-transform:uppercase}.quick{width:100%;min-width:130px;padding:6px;border:1px solid #cbd2dc;border-radius:5px}.back{position:fixed;inset:0;background:#10182888;display:grid;place-items:center;padding:16px;z-index:10}.modal{background:#fff;border-radius:12px;width:min(1050px,100%);max-height:92vh;overflow:auto}.mh,.mf{padding:14px 18px;display:flex;justify-content:space-between;gap:8px;position:sticky;background:#fff}.mh{top:0;border-bottom:1px solid var(--line)}.mf{bottom:0;border-top:1px solid var(--line);justify-content:flex-end}.mb{padding:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:700}.field input,.field select,.field textarea{padding:9px;border:1px solid #cbd2dc;border-radius:6px}.span2{grid-column:span 2}.span3{grid-column:span 3}@media(max-width:900px){.grid{grid-template-columns:1fr}.span2,.span3{grid-column:span 1}.system-header{margin:10px}.stagebar{margin:10px}.main{padding:0 10px 20px}}
</style></head><body>
<header class="system-header"><div><div class="system-title">🏥 Sistema de Controle de Cirurgias Eletivas</div><div id="who" class="system-user"></div></div><div>Hospital Geral - Módulo Operacional</div></header>
<nav class="stagebar" id="stagebar"></nav><main class="main"><div class="content-card"><div id="content">Carregando...</div></div></main><div id="modal"></div>
<script>
const URL='https://uulsxmdycbihwkbftcdv.supabase.co',KEY='sb_publishable_odmXzemIQZwx1BxrJiUYnQ_iZfPVHlV';let token=localStorage.getItem('sb_access_token');if(!token)location.href='/';
function jwt(){try{return JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch{return{}}}const uid=jwt().sub;
const labels={fila:'Fila de Cirurgia',pendencias:'Pendências',consulta_preop:'Consulta Pré-Op',exames:'Exames (NIR)',entrevista_tecnico:'Triagem Enfermagem',avaliacao_enfermeiro:'Avaliação Enfermeiro',mapa_cirurgico:'Mapa Cirúrgico',cancelada:'Canceladas',pos_operatorio:'Pós-Operatório'};
const stages=Object.keys(labels),opts={specialty:['CIRURGIA GERAL','UROLOGIA','CABEÇA E PESCOÇO','ORTOPEDIA','PLÁSTICA','GINECOLOGIA','VASCULAR'],surgeon:['KATARINE CAETANO','LUCAS MEIRA','LUCAS ARAGÃO','CARLOS VIEIRA','SERGIO QUEIROZ','IAGO AMORIM','MAIRA BOTELHO','GLEDSON ANDRADE','ERICO CORREIA','THIAGO RIBEIRO','DAVID MARCIO','TIAGO GUTIERREZ','JOÃO MUSSY','WESLLEY SANTIAGO','ANDRÉ MELO','ARTEMIO ROCHA','MURILO GARROTE','CARLOS KAKUDA','LUCAS COSTA','JOSÉ CARLOS','CARLOS HENRIQUE','ALEX FRANCO','LEONARDO CORTEZ','BRUNO CINTRA','FABIO SALES','TIRZAH WYNNE'],patient_status:['SOLICITADO','PENDENTE','AGUARDANDO ATENDIMENTO','NEGADO','DEVOLVIDO','REALIZADA','AUTORIZADA','ÓBITO','EXCLUÍDO','DESISTÊNCIA','SUSPENSA','ARQUIVADO','PENDENTE PRE OP'],request_status:['ATIVO','EM PREPARAÇÃO','PROCESSO FINALIZADO','SUSPENSO']};
let S={rows:[],stage:'fila',profile:null};const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(path,opt={}){let r=await fetch(URL+path,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json',Prefer:'return=representation',...(opt.headers||{})}});if(r.status===401){localStorage.clear();location.href='/';throw 0}let t=await r.text(),j=t?JSON.parse(t):null;if(!r.ok)throw new Error(j?.message||j?.error||t||('HTTP '+r.status));return j}
async function boot(){try{let p=await api('/rest/v1/profiles?id=eq.'+uid+'&select=*');S.profile=p?.[0];if(!S.profile?.approved){document.getElementById('content').innerHTML='<h2>Aguardando aprovação</h2><p>Seu acesso ainda não foi aprovado.</p>';return}document.getElementById('who').textContent=(S.profile.full_name||'Usuário')+' · '+S.profile.role;renderNav();await load();render();setInterval(async()=>{await load();renderTableOnly()},5000)}catch(e){document.getElementById('content').innerHTML='<b>Erro:</b> '+esc(e.message||e)}}
function renderNav(){document.getElementById('stagebar').innerHTML=stages.map((s,i)=>`<button class="nav ${s===S.stage?'on':''}" onclick="setStage('${s}',this)">${i+1}. ${labels[s]}</button>`).join('')+'<button class="nav exit" onclick="logout()">Sair</button>'}
function setStage(s,el){S.stage=s;document.querySelectorAll('.nav').forEach(x=>x.classList.remove('on'));el.classList.add('on');render()}
async function load(){S.rows=await api('/rest/v1/surgeries?select=*&order=created_at.desc&limit=5000')||[]}
function current(){return S.rows.filter(x=>x.stage===S.stage)}function render(){document.getElementById('content').innerHTML=`<div class="top"><div><h2>${labels[S.stage]}</h2><div class="muted">Atualização automática entre máquinas</div></div><button class="btn primary" onclick="editPatient()">+ Novo paciente</button></div><div class="toolbar"><input id="q" placeholder="Buscar paciente, IDS, CPF..." oninput="renderTableOnly()"><select id="st" onchange="renderTableOnly()"><option value="">Todas as situações</option>${opts.patient_status.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="notice">Campos com seta são de preenchimento rápido e salvam imediatamente.</div><div id="table"></div>`;renderTableOnly()}
function renderTableOnly(){if(!document.getElementById('table'))return;let q=(document.getElementById('q')?.value||'').toLowerCase(),st=document.getElementById('st')?.value||'',r=current().filter(x=>(!st||x.patient_status===st)&&(!q||[x.patient_name,x.ids,x.cpf,x.procedure_name,x.surgeon].some(v=>String(v||'').toLowerCase().includes(q))));document.getElementById('table').innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>Paciente</th><th>IDS</th><th>Procedimento</th><th>Especialidade</th><th>Médico</th><th>Situação paciente</th><th>Situação solicitação</th><th>Ações</th></tr></thead><tbody>${r.length?r.map(x=>`<tr><td><b>${esc(x.patient_name)}</b><br><span class="muted">${esc(x.cpf||'')}</span></td><td>${esc(x.ids||'')}</td><td>${esc(x.procedure_name||'')}</td><td>${selQuick(x,'specialty',opts.specialty)}</td><td>${selQuick(x,'surgeon',opts.surgeon)}</td><td>${selQuick(x,'patient_status',opts.patient_status)}</td><td>${selQuick(x,'request_status',opts.request_status)}</td><td><button class="btn secondary small" onclick="editPatient('${x.id}')">Editar</button> <button class="btn primary small" onclick="advance('${x.id}')">Avançar</button></td></tr>`).join(''):'<tr><td colspan="8" style="text-align:center;padding:28px">Nenhum registro.</td></tr>'}</tbody></table></div>`}
function selQuick(x,f,a){return `<select class="quick" onchange="quick('${x.id}','${f}',this.value)"><option></option>${a.map(v=>`<option ${x[f]===v?'selected':''}>${esc(v)}</option>`).join('')}</select>`}
async function quick(id,f,v){try{await api('/rest/v1/surgeries?id=eq.'+id,{method:'PATCH',body:JSON.stringify({[f]:v||null,updated_by:uid})});let x=S.rows.find(r=>r.id===id);if(x)x[f]=v||null}catch(e){alert(e.message)}}
function f(l,id,v='',type='text',cl=''){return `<div class="field ${cl}"><label>${l}</label><input id="f_${id}" type="${type}" value="${esc(v||'')}"></div>`}
function s(l,id,v,a){return `<div class="field"><label>${l}</label><select id="f_${id}"><option></option>${a.map(z=>`<option ${v===z?'selected':''}>${esc(z)}</option>`).join('')}</select></div>`}
function editPatient(id=''){let r=id?S.rows.find(x=>x.id===id):{};document.getElementById('modal').innerHTML=`<div class="back"><div class="modal"><div class="mh"><b>${id?'Editar paciente':'Novo paciente'}</b><button class="btn secondary" onclick="document.getElementById('modal').innerHTML=''">Fechar</button></div><div class="mb"><div class="grid">${f('Nome completo','patient_name',r.patient_name)}${f('IDS','ids',r.ids)}${f('CPF','cpf',r.cpf)}${f('Contato / WhatsApp','phone',r.phone)}${f('Data solicitação AIH','aih_request_date',r.aih_request_date,'date')}${f('Data cadastro IDS','ids_register_date',r.ids_register_date,'date')}${f('Procedimento cirúrgico','procedure_name',r.procedure_name,'text','span2')}${f('Código do procedimento','sigtap_code',r.sigtap_code)}${s('Especialidade','specialty',r.specialty,opts.specialty)}${s('Médico cirurgião','surgeon',r.surgeon,opts.surgeon)}${f('Data de nascimento','birth_date',r.birth_date,'date')}${f('Data da programação','programming_date',r.programming_date,'date')}${s('Situação do paciente','patient_status',r.patient_status,opts.patient_status)}${s('Situação da solicitação','request_status',r.request_status,opts.request_status)}${f('Data da cirurgia','surgery_date',r.surgery_date,'date')}<div class="field span3"><label>Observações</label><textarea id="f_suspension_notes">${esc(r.suspension_notes||'')}</textarea></div></div></div><div class="mf"><button class="btn primary" onclick="save('${id}')">Gravar alterações</button></div></div></div>`}
async function save(id){let keys=['patient_name','ids','cpf','phone','aih_request_date','ids_register_date','procedure_name','sigtap_code','specialty','surgeon','birth_date','programming_date','patient_status','request_status','surgery_date','suspension_notes'],d={};keys.forEach(k=>d[k]=document.getElementById('f_'+k)?.value||null);if(!d.patient_name)return alert('Informe o nome.');try{if(id)await api('/rest/v1/surgeries?id=eq.'+id,{method:'PATCH',body:JSON.stringify({...d,updated_by:uid})});else await api('/rest/v1/surgeries',{method:'POST',body:JSON.stringify({...d,stage:S.stage,created_by:uid,updated_by:uid})});document.getElementById('modal').innerHTML='';await load();render()}catch(e){alert(e.message)}}
async function advance(id){let i=stages.indexOf(S.stage);if(i<0||i===stages.length-1)return;await api('/rest/v1/surgeries?id=eq.'+id,{method:'PATCH',body:JSON.stringify({stage:stages[i+1],updated_by:uid})});await load();render()}
function logout(){localStorage.clear();location.href='/'}
boot();
</script></body></html>
