name: Patch consultas e Duplo J
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-consulta-duploj.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar app
        shell: python
        run: |
          from pathlib import Path
          p=Path('app.html')
          lines=p.read_text(encoding='utf-8').splitlines()
          css='''.consult-filters{display:grid;grid-template-columns:2fr 1.25fr 1.25fr 1.25fr;gap:8px;margin:14px 0;padding:12px;background:#f7f9fc;border:1px solid #d7e0ea;border-radius:9px}.consult-filters input,.consult-filters select{padding:9px;border:1px solid #c9d6e6;border-radius:7px;background:#fff}.dj-note{background:#eaf7f0;border-left:4px solid #0f8a4b;padding:10px 12px;margin:12px 0;font-size:12px}@media(max-width:900px){.consult-filters{grid-template-columns:1fr 1fr}}@media(max-width:600px){.consult-filters{grid-template-columns:1fr}}'''
          text='\n'.join(lines)
          if '.consult-filters{' not in text:
              text=text.replace('</style>',css+'\n</style>')
          lines=text.splitlines()
          out=[]
          for line in lines:
              if line.startswith('function renderConsult(){'):
                  out.extend([
"function consultRows(){return S.rows.filter(x=>x.stage==='consulta_preop'||x.appointment_date||x.consultation_date)}",
"function consultOptions(){let rows=consultRows(),docs=[...new Set(rows.map(x=>x.surgeon).filter(Boolean))].sort(),spec=[...new Set(rows.map(x=>x.specialty).filter(Boolean))].sort();return {docs,spec}}",
"function consultFiltered(){let rows=consultRows(),q=(document.getElementById('cq')?.value||'').trim().toLowerCase(),d=document.getElementById('cd')?.value||'',sp=document.getElementById('cs')?.value||'',st=document.getElementById('cstatus')?.value||'';return filtered(rows).filter(x=>(!q||[x.patient_name,x.cpf,x.ids].some(v=>String(v||'').toLowerCase().includes(q)))&&(!d||x.surgeon===d)&&(!sp||x.specialty===sp)&&(!st||x.patient_status===st))}",
"function renderConsult(){let o=consultOptions();document.getElementById('content').innerHTML=`<section class=\"card\"><div class=\"section-head\"><div><h2>📅 Agendamento de Consultas Pré-Operatórias</h2><div class=\"sub\">Todas as especialidades reunidas em uma única tela</div></div></div><div class=\"consult-filters\"><input id=\"cq\" placeholder=\"Pesquisar por nome, CPF ou IDS\" oninput=\"renderConsultTableOnly()\"><select id=\"cd\" onchange=\"renderConsultTableOnly()\"><option value=\"\">Todos os médicos</option>${o.docs.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id=\"cs\" onchange=\"renderConsultTableOnly()\"><option value=\"\">Todas as especialidades</option>${o.spec.map(x=>`<option>${esc(x)}</option>`).join('')}</select><select id=\"cstatus\" onchange=\"renderConsultTableOnly()\"><option value=\"\">Todos os status da cirurgia</option>${patientStatuses.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div class=\"dj-note\">Ao marcar <b>Duplo J = SIM</b>, o paciente passa a aparecer automaticamente também na aba <b>Acompanhamento de Duplo J</b>.</div><div id=\"consultTableBox\"></div></section>`;renderConsultTableOnly()}",
"function renderConsultTableOnly(){let box=document.getElementById('consultTableBox');if(box)box.innerHTML=consultTable(consultFiltered())}"
                  ])
              elif line.startswith('function consultTable(rows){'):
                  out.append("function consultTable(rows){return `<div class=\"tablewrap\"><table class=\"table\"><thead><tr><th class=\"actions\">AÇÕES</th><th>DATA AGENDAMENTO</th><th>NOME DO PACIENTE</th><th>CPF</th><th>ESPECIALIDADE</th><th>MÉDICO</th><th>DATA CONSULTA</th><th>HORÁRIO</th><th>UNIDADE PROVENIENTE</th><th>RESPONSÁVEL</th><th>STATUS CIRURGIA</th><th>DUPLO J</th><th>DATA INSTALAÇÃO</th><th>TELEFONE</th><th>OBSERVAÇÕES</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td>${actionButtons(x)} <button class=\"btn small\" onclick=\"editConsult('${x.id}')\">📅 Agenda</button></td><td>${esc(x.appointment_date||'')}</td><td><b>${esc(x.patient_name)}</b></td><td>${esc(x.cpf||'')}</td><td>${esc(x.specialty||'')}</td><td>${esc(x.surgeon||'')}</td><td>${esc(x.consultation_date||'')}</td><td>${esc(x.consultation_time||'')}</td><td>${esc(x.source_unit||'')}</td><td>${esc(x.appointment_responsible||'')}</td><td>${statusPill(x.patient_status)}</td><td>${x.double_j?'<span class=\"pill ok\">SIM</span>':'NÃO'}</td><td>${esc(x.double_j_insert_date||'')}</td><td>${esc(x.phone||'')}</td><td>${esc(x.consultation_notes||'')}</td></tr>`).join(''):'<tr><td colspan=\"15\" style=\"text-align:center;padding:28px\">Nenhum paciente encontrado.</td></tr>'}</tbody></table></div>`}")
              elif line.startswith('function editConsult(id){'):
                  out.append("function editConsult(id){let x=S.rows.find(r=>r.id===id),o=consultOptions(),spec=[...new Set([...o.spec,x.specialty].filter(Boolean))].sort(),docs=[...new Set([...o.docs,x.surgeon].filter(Boolean))].sort();document.getElementById('modal').innerHTML=`<div class=\"back\"><div class=\"modal\"><div class=\"mh\"><b>📅 Agendamento: ${esc(x.patient_name)}</b><button class=\"btn\" onclick=\"document.getElementById('modal').innerHTML=''\">Fechar</button></div><div class=\"mb\"><div class=\"notice\"><b>CPF:</b> ${esc(x.cpf||'—')} &nbsp; <b>IDS:</b> ${esc(x.ids||'—')}</div><div class=\"grid\">${field('Data do agendamento','appointment_date',x.appointment_date,'date')}${field('Data da consulta','consultation_date',x.consultation_date,'date')}${field('Horário','consultation_time',x.consultation_time,'time')}${selectField('Especialidade','specialty',x.specialty,spec)}${selectField('Médico','surgeon',x.surgeon,docs)}${selectField('Status da cirurgia','patient_status',x.patient_status,patientStatuses)}${field('Unidade proveniente','source_unit',x.source_unit)}${field('Responsável pelo agendamento','appointment_responsible',x.appointment_responsible)}${selectField('Duplo J','double_j',x.double_j?'SIM':'NÃO',['NÃO','SIM'])}${field('Data de instalação do Duplo J','double_j_insert_date',x.double_j_insert_date,'date')}<div class=\"field span3\"><label>Observações</label><textarea id=\"f_consultation_notes\">${esc(x.consultation_notes||'')}</textarea></div></div></div><div class=\"mf\"><button class=\"btn primary\" onclick=\"saveConsult('${id}')\">Salvar</button></div></div></div>`}")
              elif line.startswith('async function saveConsult(id){'):
                  out.append("async function saveConsult(id){let dj=document.getElementById('f_double_j').value==='SIM',djDate=document.getElementById('f_double_j_insert_date').value||null;if(dj&&!djDate)return alert('Informe a data de instalação do Duplo J.');let d={appointment_date:document.getElementById('f_appointment_date').value||null,consultation_date:document.getElementById('f_consultation_date').value||null,consultation_time:document.getElementById('f_consultation_time').value||null,specialty:document.getElementById('f_specialty').value||null,surgeon:document.getElementById('f_surgeon').value||null,patient_status:document.getElementById('f_patient_status').value||null,source_unit:document.getElementById('f_source_unit').value||null,appointment_responsible:document.getElementById('f_appointment_responsible').value||null,double_j:dj,double_j_insert_date:dj?djDate:null,consultation_notes:document.getElementById('f_consultation_notes').value||null,updated_by:uid};await api('/rest/v1/surgeries?id=eq.'+id,{method:'PATCH',body:JSON.stringify(d)});document.getElementById('modal').innerHTML='';await load();fillFilters();renderConsult();if(dj)alert('Agendamento salvo. Paciente incluído automaticamente no Acompanhamento de Duplo J.')}")
              elif line.startswith('function renderDoubleJ(){'):
                  out.append("function renderDoubleJ(){let rows=filtered(S.rows.filter(x=>x.double_j));document.getElementById('content').innerHTML=`<section class=\"card\"><div class=\"section-head\"><div><h2>🩺 Acompanhamento de Duplo J (${rows.length})</h2><div class=\"sub\">Inclusão automática de todo paciente marcado como Duplo J na tela de consultas</div></div></div><div class=\"dj-note\">A <b>data de instalação</b> é obrigatória quando Duplo J estiver marcado como SIM.</div><div class=\"tablewrap\"><table class=\"table\"><thead><tr><th class=\"actions\">AÇÕES</th><th>PACIENTE</th><th>CPF</th><th>IDS</th><th>ESPECIALIDADE</th><th>MÉDICO</th><th>DATA INSTALAÇÃO</th><th>PROCEDIMENTO</th><th>STATUS CIRURGIA</th><th>ETAPA ATUAL</th><th>OBSERVAÇÕES</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${actionButtons(x)} <button class=\"btn small\" onclick=\"editConsult('${x.id}')\">✏ Duplo J</button></td><td><b>${esc(x.patient_name)}</b></td><td>${esc(x.cpf||'')}</td><td>${esc(x.ids||'')}</td><td>${esc(x.specialty||'')}</td><td>${esc(x.surgeon||'')}</td><td>${esc(x.double_j_insert_date||'')}</td><td>${esc(x.procedure_name||'')}</td><td>${statusPill(x.patient_status)}</td><td>${esc(labels[x.stage]||x.stage)}</td><td>${esc(x.consultation_notes||'')}</td></tr>`).join('')||'<tr><td colspan=\"11\" style=\"text-align:center;padding:28px\">Nenhum paciente com Duplo J.</td></tr>'}</tbody></table></div></section>`}")
              else:
                  out.append(line)
          p.write_text('\n'.join(out)+'\n',encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add app.html
          git diff --cached --quiet || git commit -m "feat: filtros de consultas e acompanhamento automatico de duplo j"
          git push